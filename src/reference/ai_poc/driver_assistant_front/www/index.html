<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Assistant Detector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d9ff;
            font-size: 2.5em;
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
        }

        .status {
            background: #16213e;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            border: 2px solid #0f3460;
        }

        .status.connected {
            border-color: #00ff88;
            background: #16213e;
        }

        .status.disconnected {
            border-color: #ff4444;
            background: #2e1616;
        }

        .situation {
            background: #0f3460;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .situation .color {
            width: 100%;
            height: 200px;
            margin-bottom: 20px;
            border-radius: 10px;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .situation .color.GREEN {
            background-color: #00ff88;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.8);
        }

        .situation .color.RED {
            background-color: #ff4444;
            box-shadow: 0 0 40px rgba(255, 68, 68, 0.8);
        }

        .situation .color.YELLOW {
            background-color: #ffee00;
            box-shadow: 0 0 40px rgba(255, 238, 0, 0.8);
        }

        .situation .color.NONE {
            background-color: #000000;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .arrows {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .arrow {
            padding: 10px 20px;
            background: #16213e;
            border-radius: 5px;
            opacity: 0.3;
            transition: opacity 0.3s;
        }

        .arrow.active {
            opacity: 1;
            background: #00d9ff;
            color: #000;
            font-weight: bold;
        }

        .detections h2 {
            color: #00d9ff;
            margin-bottom: 15px;
        }

        .detection-item {
            background: #0f3460;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 4px solid #00d9ff;
        }

        .detection-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .class-name {
            font-weight: bold;
            color: #00ff88;
        }

        .confidence {
            color: #ffee00;
        }

        .bbox {
            font-size: 0.9em;
            color: #aaa;
            font-family: monospace;
        }

        .timestamp {
            background: #0f3460;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            color: #00d9ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status disconnected" id="status">
            Connecting to server...
        </div>

        <div class="timestamp" id="timestamp">
            Timestamp: --
        </div>

        <div class="situation">
            <div class="color NONE" id="color"></div>
            <div class="arrows">
                <div class="arrow" id="arrow-left">← Left</div>
                <div class="arrow" id="arrow-forward">↑ Forward</div>
                <div class="arrow" id="arrow-right">Right →</div>
            </div>
        </div>

        <div class="detections">
            <div id="detection-list"></div>
        </div>
    </div>

    <script>
        const ws = new WebSocket('ws://' + window.location.hostname + ':8080', 'detection-protocol');
        const statusEl = document.getElementById('status');
        const timestampEl = document.getElementById('timestamp');
        const colorEl = document.getElementById('color');
        const arrowLeftEl = document.getElementById('arrow-left');
        const arrowForwardEl = document.getElementById('arrow-forward');
        const arrowRightEl = document.getElementById('arrow-right');
        const detectionCountEl = document.getElementById('detection-count');
        const detectionListEl = document.getElementById('detection-list');

        ws.onopen = () => {
            statusEl.textContent = 'Connected';
            statusEl.className = 'status connected';
        };

        ws.onclose = () => {
            statusEl.textContent = 'Disconnected';
            statusEl.className = 'status disconnected';
        };

        ws.onerror = (error) => {
            console.error('WebSocket error:', error);
            statusEl.textContent = 'Connection error';
            statusEl.className = 'status disconnected';
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);

                // Update timestamp
                timestampEl.textContent = `Timestamp: ${(data.timestamp / 1000).toFixed(3)}s`;

                // Update situation
                colorEl.textContent = data.situation.color;
                colorEl.className = `color ${data.situation.color}`;

                // Update arrows
                arrowLeftEl.className = data.situation.arrow_left ? 'arrow active' : 'arrow';
                arrowForwardEl.className = data.situation.arrow_forward ? 'arrow active' : 'arrow';
                arrowRightEl.className = data.situation.arrow_right ? 'arrow active' : 'arrow';

                detectionListEl.innerHTML = data.detections.map(det => `
                    <div class="detection-item">
                            <span class="class-name">${det.class_name}</span>
                            <span class="confidence">${(det.confidence * 100).toFixed(1)}%</span>
                    </div>
                `).join('');

            } catch (e) {
                console.error('Error parsing message:', e);
            }
        };
    </script>
</body>
</html>

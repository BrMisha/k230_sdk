<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Assistant Detector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 10px;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            max-width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d9ff;
            font-size: 2.5em;
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
        }

        .status {
            background: #16213e;
            padding: 8px;
            border-radius: 5px;
            margin-bottom: 5px;
            text-align: center;
            border: 2px solid #0f3460;
            font-size: 0.9em;
        }

        .status.connected {
            border-color: #00ff88;
            background: #16213e;
        }

        .status.disconnected {
            border-color: #ff4444;
            background: #2e1616;
        }

        .situation {
            background: #0f3460;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .situation .color {
            width: 100%;
            flex: 2;
            min-height: 100px;
            margin-bottom: 10px;
            border-radius: 10px;
            transition: background-color 0.3s, box-shadow 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            font-weight: bold;
        }

        .situation .color.GREEN {
            background-color: #00ff88;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.8);
        }

        .situation .color.RED {
            background-color: #ff4444;
            box-shadow: 0 0 40px rgba(255, 68, 68, 0.8);
        }

        .situation .color.YELLOW {
            background-color: #ffee00;
            box-shadow: 0 0 40px rgba(255, 238, 0, 0.8);
        }

        .situation .color.NONE {
            background-color: #000000;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .arrows {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex: 1;
        }

        .arrow {
            font-size: 4em;
            opacity: 0.2;
            transition: opacity 0.3s, color 0.3s;
            color: #888;
        }

        .arrow.active {
            opacity: 1;
            color: #00ff88;
        }

        .detections h2 {
            color: #00d9ff;
            margin-bottom: 15px;
        }

        .detection-item {
            background: #0f3460;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 4px solid #00d9ff;
        }

        .detection-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .class-name {
            font-weight: bold;
            color: #00ff88;
        }

        .confidence {
            color: #00d9ff;
        }

        .bbox {
            font-size: 0.9em;
            color: #aaa;
            font-family: monospace;
        }

        .timestamp {
            background: #0f3460;
            padding: 5px;
            border-radius: 5px;
            text-align: center;
            color: #00d9ff;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .detections {
            flex-shrink: 0;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status disconnected" id="status">
            Connecting to server...
        </div>

        <div class="timestamp" id="timestamp">
            Timestamp: --
        </div>

        <div class="situation">
            <div class="color NONE" id="color"></div>
            <div class="arrows">
                <div class="arrow" id="arrow-left">←</div>
                <div class="arrow" id="arrow-forward">↑</div>
                <div class="arrow" id="arrow-right">→</div>
            </div>
        </div>

        <div class="detections">
            <div id="detection-list"></div>
        </div>
    </div>

    <script>
        const ws = new WebSocket('ws://' + window.location.hostname + ':8080', 'detection-protocol');
        const statusEl = document.getElementById('status');
        const timestampEl = document.getElementById('timestamp');
        const colorEl = document.getElementById('color');
        const arrowLeftEl = document.getElementById('arrow-left');
        const arrowForwardEl = document.getElementById('arrow-forward');
        const arrowRightEl = document.getElementById('arrow-right');
        const detectionCountEl = document.getElementById('detection-count');
        const detectionListEl = document.getElementById('detection-list');

        ws.onopen = () => {
            statusEl.textContent = 'Connected';
            statusEl.className = 'status connected';
        };

        ws.onclose = () => {
            statusEl.textContent = 'Disconnected';
            statusEl.className = 'status disconnected';
        };

        ws.onerror = (error) => {
            console.error('WebSocket error:', error);
            statusEl.textContent = 'Connection error';
            statusEl.className = 'status disconnected';
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);

                // Update timestamp (convert microseconds to milliseconds for Date)
                const date = new Date(data.timestamp / 1000);
                const timeStr = date.toLocaleTimeString('en-US', {
                    hour12: false,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
            });
                const dateStr = date.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit'
                });
                timestampEl.textContent = `${dateStr} ${timeStr}`;

                // Update situation
                colorEl.textContent = data.situation.color;
                colorEl.className = `color ${data.situation.color}`;

                // Update arrows
                arrowLeftEl.className = data.situation.arrow_left ? 'arrow active' : 'arrow';
                arrowForwardEl.className = data.situation.arrow_forward ? 'arrow active' : 'arrow';
                arrowRightEl.className = data.situation.arrow_right ? 'arrow active' : 'arrow';

                detectionListEl.innerHTML = data.detections.map(det => {
                    // Determine color based on class name
                    let nameColor = '#ffffff';
                    const lowerName = det.class_name.toLowerCase();
                    if (lowerName.includes('green')) {
                        nameColor = '#00ff88';
                    } else if (lowerName.includes('red')) {
                        nameColor = '#ff4444';
                    } else if (lowerName.includes('yellow')) {
                        nameColor = '#ffee00';
                    }

                    return `
                        <div class="detection-item">
                            <span class="class-name" style="color: ${nameColor}">${det.class_name}</span>
                            <span class="confidence">${(det.confidence * 100).toFixed(1)}%</span>
                        </div>
                    `;
                }).join('');

            } catch (e) {
                console.error('Error parsing message:', e);
            }
        };
    </script>
</body>
</html>
